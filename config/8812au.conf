# WDPi legacy USB Wi-Fi adapter configuration
#
# The server uses an Edimax USB adapter driven by the out-of-tree 8812au
# module on Raspbian Jessie. Disable driver-level power-saving features to
# favor stable, continuously available server connectivity.
#
# This is a sanitized copy of /etc/modprobe.d/8812au.conf.

options 8812au rtw_ips_mode=0 rtw_power_mgnt=0 rtw_low_power=0 rtw_enusbss=0
